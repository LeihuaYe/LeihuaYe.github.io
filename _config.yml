title: Leihua Ye, PhD
tagline: Data Science in Silicon Valley
description: Experimentation, causal inference, and building with AI. Running tests is easy; running trustworthy tests is hard.
url: https://leihuaye.github.io
email: yeleihua@gmail.com
markdown: kramdown
permalink: pretty

collections:
  notes:
    output: true
    permalink: /notes/:title/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: notes
    values:
      layout: note

nav:
  - title: Writing
    url: /writing/
  - title: Tools
    url: /tools/
  - title: Notes
    url: /notes/
    needs_notes: true
  - title: About
    url: /about/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

author: Leihua Ye
social:
  name: Leihua Ye
  links:
    - https://www.linkedin.com/in/leihuaye/
    - https://github.com/LeihuaYe
    - https://leihua-ye.medium.com
    - https://techvalley.substack.com
    - https://scholar.google.com/citations?user=s_OeV6UAAAAJ

exclude:
  - README.md
